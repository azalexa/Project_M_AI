trigger:
  branches:
    include:
      - main

pr: none

pool:
  vmImage: 'ubuntu-latest'

steps:
  - checkout: self

  - task: AzureCLI@2
    displayName: 'Deploy MechMaster frontend'
    inputs:
      azureSubscription: 'sc-project-m-ai-dev'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        set -euo pipefail

        echo "Checking Azure connection"
        az account show --output table

        echo "Checking frontend files"
        test -f "$(Build.SourcesDirectory)/frontend/index.html"

        echo "Deploying frontend"
        az storage blob upload-batch \
          --account-name "stmmtdevb80b98b57ede" \
          --destination '$web' \
          --source "$(Build.SourcesDirectory)/frontend" \
          --auth-mode login \
          --overwrite true \
          --output table

        echo "Deployment completed"
