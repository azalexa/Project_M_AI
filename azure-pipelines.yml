
trigger: none
pr: none

pool:
  vmImage: 'ubuntu-latest'

steps:
  - checkout: self

  - task: AzureCLI@2
    displayName: 'test Azure'
    inputs:
      azureSubscription: 'sc-project-m-ai-dev'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        echo "subskrypcje:"
        az account show --query "name" -o tsv

        echo "Resource Group:"
        az group show \
          --name rg-project-m-ai-dev \
          --query "{name:name, location:location}" \
          -o table

        echo "azure connection works"
